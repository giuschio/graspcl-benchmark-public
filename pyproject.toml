[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-cl-integration"
version = "0.1.0"
description = "Paper reproduction scripts and experiment glue for grasp continual learning."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["grasp_cl_integration*"]

